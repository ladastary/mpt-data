name: Probe history depth
on:
  workflow_dispatch:
  push:
    paths: [probe_history.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python probe_history.py
      - run: |
          git config user.name "mpt-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROBE.md probe_french_*.csv && git commit -m "History probe" && git pull --rebase origin main && git push origin HEAD:main || true
